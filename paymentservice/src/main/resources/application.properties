spring.application.name=paymentservice

server.port=8082

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.project.paymentservice.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false


eureka.client.service-url.defaultZone=http://eureka:8761/eureka

eureka.instance.prefer-ip-address=true

gateway.secret=my-gateway-secret

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans