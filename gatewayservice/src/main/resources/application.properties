spring.application.name=gatewayservice
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://orderservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://userservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/internal/users/**

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://productservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://paymentservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**

spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://authservice
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/internal/auth/**

spring.cloud.gateway.server.webflux.routes[5].id=admin-route
spring.cloud.gateway.server.webflux.routes[5].uri=lb://userservice
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/admin/**

spring.cloud.gateway.server.webflux.routes[6].id=inventory-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://inventoryservice
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/inventory/**

eureka.client.service-url.defaultZone=http://eureka:8761/eureka

eureka.instance.prefer-ip-address=true

jwt.secret=myverysecretkeymyverysecretkeymyverysecretkey

gateway.secret=my-gateway-secret

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans