name: Build and Deploy to Azure AKS

on:
  push:
    branches: [ "main", "ecom" ]
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME || 'ecomregistry6821' }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'ecom-rg' }}
  CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME || 'ecom-aks' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Java 17 for Spring Boot microservices
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 2. Build all Java microservices
      - name: Build Backend Microservices with Maven
        run: |
          chmod +x */mvnw || true
          services=("servicediscovery" "gatewayservice" "authservice" "userservice" "productservice" "orderservice" "paymentservice" "inventoryservice")
          for svc in "${services[@]}"; do
            echo "Building $svc..."
            (cd $svc && (mvn clean package -DskipTests || ./mvnw clean package -DskipTests))
          done

      # 3. Log in to Azure Container Registry (ACR) via Docker Login
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME || 'ecomregistry6821' }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Build and Push Docker Images
      - name: Build & Push Images to ACR
        run: |
          REGISTRY="${ACR_NAME}.azurecr.io"
          TAG="${{ github.sha }}"

          # Backend images
          docker build -t $REGISTRY/service-discovery:$TAG -t $REGISTRY/service-discovery:latest ./servicediscovery
          docker build -t $REGISTRY/gateway-service:$TAG -t $REGISTRY/gateway-service:latest ./gatewayservice
          docker build -t $REGISTRY/auth-service:$TAG -t $REGISTRY/auth-service:latest ./authservice
          docker build -t $REGISTRY/user-service:$TAG -t $REGISTRY/user-service:latest ./userservice
          docker build -t $REGISTRY/product-service:$TAG -t $REGISTRY/product-service:latest ./productservice
          docker build -t $REGISTRY/order-service:$TAG -t $REGISTRY/order-service:latest ./orderservice
          docker build -t $REGISTRY/payment-service:$TAG -t $REGISTRY/payment-service:latest ./paymentservice
          docker build -t $REGISTRY/inventory-service:$TAG -t $REGISTRY/inventory-service:latest ./inventoryservice

          # Frontend image
          docker build -t $REGISTRY/frontend:$TAG -t $REGISTRY/frontend:latest ./frontend

          # Push to ACR
          docker push $REGISTRY/service-discovery:latest
          docker push $REGISTRY/gateway-service:latest
          docker push $REGISTRY/auth-service:latest
          docker push $REGISTRY/user-service:latest
          docker push $REGISTRY/product-service:latest
          docker push $REGISTRY/order-service:latest
          docker push $REGISTRY/payment-service:latest
          docker push $REGISTRY/inventory-service:latest
          docker push $REGISTRY/frontend:latest

      # 5. Set Kubernetes Context using Kubeconfig
      - name: Set K8s Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # 6. Update Image Registry in Kubernetes Manifests and Deploy
      - name: Deploy to AKS
        run: |
          REGISTRY="${ACR_NAME}.azurecr.io"

          # Replace local image references with ACR registry
          sed -i "s|image: service-discovery:latest|image: $REGISTRY/service-discovery:latest|g" k8s/eureka.yaml
          sed -i "s|image: gateway-service:latest|image: $REGISTRY/gateway-service:latest|g" k8s/gateway.yaml
          sed -i "s|image: auth-service:latest|image: $REGISTRY/auth-service:latest|g" k8s/auth-service.yaml
          sed -i "s|image: user-service:latest|image: $REGISTRY/user-service:latest|g" k8s/user-service.yaml
          sed -i "s|image: product-service:latest|image: $REGISTRY/product-service:latest|g" k8s/product-service.yaml
          sed -i "s|image: order-service:latest|image: $REGISTRY/order-service:latest|g" k8s/order-service.yaml
          sed -i "s|image: payment-service:latest|image: $REGISTRY/payment-service:latest|g" k8s/payment-service.yaml
          sed -i "s|image: inventory-service:latest|image: $REGISTRY/inventory-service:latest|g" k8s/inventory-service.yaml
          sed -i "s|image: frontend:latest|image: $REGISTRY/frontend:latest|g" k8s/frontend.yaml

          # Apply all manifests to Kubernetes
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/
