name: Build and Deploy to Azure AKS

on:
  push:
    branches: [ "main", "ecom" ]
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME || 'ecomregistry6821' }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'ecom-rg' }}
  CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME || 'ecom-aks' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Parallel Build & Push for Backend Spring Boot Microservices
  # ---------------------------------------------------------------------------
  build-and-push-backend:
    name: Build ${{ matrix.service.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: servicediscovery
            image: service-discovery
          - name: gatewayservice
            image: gateway-service
          - name: authservice
            image: auth-service
          - name: userservice
            image: user-service
          - name: productservice
            image: product-service
          - name: orderservice
            image: order-service
          - name: paymentservice
            image: payment-service
          - name: inventoryservice
            image: inventory-service
          - name: recommendationservice
            image: recommendation-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests and Build JAR
        run: |
          cd ${{ matrix.service.name }}
          chmod +x ./mvnw || true
          mvn clean test package || ./mvnw clean test package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME || 'ecomregistry6821' }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.name }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service.image }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.image }}

  # ---------------------------------------------------------------------------
  # 2. Build & Push Frontend (React + Vite + Nginx)
  # ---------------------------------------------------------------------------
  build-and-push-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME || 'ecomregistry6821' }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # 3. Continuous Deployment to AKS with Health Rollout Checks
  # ---------------------------------------------------------------------------
  deploy-to-aks:
    name: Deploy to Azure AKS
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Update Manifests with Immutable SHA & Deploy
        run: |
          REGISTRY="${ACR_NAME}.azurecr.io"
          TAG="${{ github.sha }}"

          echo "Deploying version tag: $TAG from registry: $REGISTRY"

          # Replace image tags with the immutable commit SHA
          sed -i "s|image: .*service-discovery:.*|image: $REGISTRY/service-discovery:$TAG|g" k8s/eureka.yaml
          sed -i "s|image: .*gateway-service:.*|image: $REGISTRY/gateway-service:$TAG|g" k8s/gateway.yaml
          sed -i "s|image: .*auth-service:.*|image: $REGISTRY/auth-service:$TAG|g" k8s/auth-service.yaml
          sed -i "s|image: .*user-service:.*|image: $REGISTRY/user-service:$TAG|g" k8s/user-service.yaml
          sed -i "s|image: .*product-service:.*|image: $REGISTRY/product-service:$TAG|g" k8s/product-service.yaml
          sed -i "s|image: .*order-service:.*|image: $REGISTRY/order-service:$TAG|g" k8s/order-service.yaml
          sed -i "s|image: .*payment-service:.*|image: $REGISTRY/payment-service:$TAG|g" k8s/payment-service.yaml
          sed -i "s|image: .*inventory-service:.*|image: $REGISTRY/inventory-service:$TAG|g" k8s/inventory-service.yaml
          sed -i "s|image: .*recommendation-service:.*|image: $REGISTRY/recommendation-service:$TAG|g" k8s/recommendation-service.yaml
          sed -i "s|image: .*frontend:.*|image: $REGISTRY/frontend:$TAG|g" k8s/frontend.yaml

          # Enforce imagePullPolicy: Always so AKS always fetches the latest built images
          sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Always|g" k8s/*.yaml

          # Apply config maps and secrets first
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

          # Apply all remaining Kubernetes manifests
          kubectl apply -f k8s/

      - name: Verify Deployment Rollout Health
        run: |
          echo "Verifying rollout status for all deployed workloads..."
          deployments=(
            "eureka-server"
            "gateway"
            "auth-service"
            "user-service"
            "product-service"
            "recommendation-service"
            "order-service"
            "payment-service"
            "inventory-service"
            "frontend"
          )

          for dep in "${deployments[@]}"; do
            echo "Checking deployment/$dep..."
            if ! kubectl rollout status deployment/"$dep" --timeout=150s; then
              echo "❌ Deployment $dep failed to become healthy!"
              echo "--- Deployment Description ---"
              kubectl describe deployment/"$dep" || true
              echo "--- Recent Pod Logs ---"
              kubectl logs -l app="$dep" --tail=50 || true
              exit 1
            fi
          done

          echo "🎉 All microservices and frontend have successfully rolled out and are healthy on Azure AKS!"
